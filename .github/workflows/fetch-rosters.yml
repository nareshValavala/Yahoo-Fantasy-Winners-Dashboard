name: Fetch Rosters

# Pulls team rosters from Fantasy Helper's public roster pages (no login
# required, unlike scores/standings) as a stopgap until Yahoo API access is
# approved, plus player trade values from Dynasty Daddy's public, documented
# API (https://dynasty-daddy.com/help/api-documentation). Both update at most
# a few times a day, so daily is plenty and respects their "don't hammer the
# servers, cache responses" request.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/fetch-rosters.mjs
      - run: node scripts/fetch-trade-values.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rosters.json data/trade-values.json
          git diff --staged --quiet || git commit -m "Update rosters and trade values [skip ci]"
          git push
