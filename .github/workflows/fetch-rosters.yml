name: Fetch Rosters

# Pulls team rosters from Fantasy Helper's public roster pages (no login
# required, unlike scores/standings) as a stopgap until Yahoo API access is
# approved. Injury statuses/waiver moves change often, so this runs daily.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/fetch-rosters.mjs

      - name: Commit updated rosters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rosters.json
          git diff --staged --quiet || git commit -m "Update rosters [skip ci]"
          git push
