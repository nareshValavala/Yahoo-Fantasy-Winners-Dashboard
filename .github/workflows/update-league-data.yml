name: Update League Data

on:
  schedule:
    # Tuesday & Wednesday mornings (13:00 UTC ≈ 8-9am ET) — Monday Night
    # Football is final by Tuesday, and Wednesday catches any late stat
    # corrections Yahoo applies mid-week.
    - cron: "0 13 * * 2,3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node scripts/update-league-data.mjs
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          LEAGUE_ID: "529714"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/league.json
          git diff --staged --quiet || git commit -m "Update league data [skip ci]"
          git push
