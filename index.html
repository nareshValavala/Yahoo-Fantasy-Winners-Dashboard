<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo Fantasy NFL Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 2.3em;
        }

        .header p {
            margin: 4px 0 0 0;
            color: #7f8c8d;
            font-size: 1.05em;
        }

        .section {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .section h2 {
            margin: 0 0 18px 0;
            color: #2c3e50;
            font-size: 1.4em;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #7f8c8d;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr.rank-1 { background: #fff8e1; }

        .cash {
            font-weight: bold;
            color: #27ae60;
        }

        .table-scroll {
            overflow-x: auto;
        }

        .payout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .payout-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }

        .payout-card .amount {
            font-size: 1.6em;
            font-weight: bold;
            color: #2c3e50;
        }

        .payout-card .label {
            color: #7f8c8d;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            background: #95a5a6;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-left: 6px;
        }

        .badge.tied {
            background: #e67e22;
        }

        .badge.paid {
            background: #27ae60;
        }

        .badge.unpaid {
            background: #e74c3c;
        }

        .badge.status {
            background: #e67e22;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
        }

        .status-warning {
            background: #fff3cd;
            color: #856404;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .footer-note {
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85em;
            margin-top: 10px;
        }

        .team-link {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: #bbb;
        }

        .team-link:hover {
            color: #3498db;
        }

        .admin-bar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 14px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .admin-bar input[type="password"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .admin-bar button {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .admin-bar button.secondary {
            background: #e74c3c;
        }

        .admin-bar .label {
            font-size: 0.85em;
            color: #7f8c8d;
        }

        .admin-badge {
            background: #27ae60;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .dues-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-overlay[hidden] {
            display: none;
        }

        .modal-box {
            background: white;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 25px;
        }

        .modal-box h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            color: #7f8c8d;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 200;
            font-size: 0.9em;
        }

        .toast.error {
            background: #e74c3c;
        }

        .data-source-note {
            display: inline-block;
            font-size: 0.8em;
            padding: 3px 10px;
            border-radius: 10px;
            margin-top: 8px;
        }

        .data-source-note.manual {
            background: #fff3cd;
            color: #856404;
        }

        .data-source-note.yahoo {
            background: #d4edda;
            color: #155724;
        }

        .manual-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 15px;
        }

        .manual-form .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .manual-form label {
            font-size: 0.8em;
            color: #7f8c8d;
        }

        .manual-form input, .manual-form select {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95em;
        }

        .manual-form button {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 0;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 10px 18px;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            color: #7f8c8d;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.06);
        }

        .tab-panel {
            margin-top: 0;
            border-top-left-radius: 0;
        }

        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .remove-link {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 0.85em;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🏈 Yahoo Fantasy NFL Tracker</h1>
            <p id="leagueSubtitle">Loading league data…</p>
            <div id="dataSourceNote"></div>
            <div>
                <button class="refresh-btn" id="refreshNowBtn" onclick="refreshNow()">🔄 Refresh Now</button>
            </div>
        </div>

        <div class="admin-bar" id="adminBar"></div>

        <div id="statusBanner"></div>

        <div class="tabs" id="tabBar">
            <button class="tab-btn" data-tab="standings" onclick="switchTab('standings')">🥇 Standings</button>
            <button class="tab-btn" data-tab="teams" onclick="switchTab('teams')">👥 Teams</button>
            <button class="tab-btn" data-tab="winners" onclick="switchTab('winners')">📋 Weekly Winners</button>
            <button class="tab-btn" data-tab="dues" onclick="switchTab('dues')">🧾 Dues &amp; Payouts</button>
            <button class="tab-btn" data-tab="manual" id="manualTabBtn" onclick="switchTab('manual')" hidden>✍️ Record Winner</button>
        </div>

        <div class="section tab-panel" data-tab="standings">
            <div class="table-scroll">
                <table id="standingsTable">
                    <thead id="standingsHead"></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="section tab-panel" data-tab="teams">
            <div class="table-scroll">
                <table id="teamsTable">
                    <thead>
                        <tr>
                            <th>Draft #</th>
                            <th>Team</th>
                            <th>Manager</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="section tab-panel" data-tab="winners">
            <div class="table-scroll">
                <table id="winnersTable">
                    <thead>
                        <tr>
                            <th>Week</th>
                            <th>Team</th>
                            <th>Manager</th>
                            <th>Score</th>
                            <th>Prize</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="section tab-panel" data-tab="dues">
            <h3 style="margin-top: 0;">Payout Structure</h3>
            <div class="payout-grid" id="payoutGrid"></div>

            <h3>Who's Paid</h3>
            <p id="duesSummary" style="margin-top: 0; color: #7f8c8d;"></p>
            <div class="table-scroll">
                <table id="duesTable">
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>Manager</th>
                            <th>Paid?</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="section tab-panel" data-tab="manual" id="manualEntrySection">
            <p style="margin-top: 0; color: #7f8c8d;">Record each week's high score by hand until Yahoo automation is connected.</p>
            <div class="manual-form">
                <div class="field">
                    <label for="manualWeek">Week</label>
                    <input type="number" id="manualWeek" min="1" max="18" style="width: 70px;">
                </div>
                <div class="field">
                    <label for="manualTeam">Team</label>
                    <select id="manualTeam"></select>
                </div>
                <div class="field">
                    <label for="manualScore">Score</label>
                    <input type="number" id="manualScore" step="0.01" style="width: 100px;">
                </div>
                <button onclick="saveManualWinner()">Save Winner</button>
            </div>
        </div>

        <p class="footer-note" id="lastUpdated"></p>
    </div>

    <div class="modal-overlay" id="rosterModal" hidden onclick="if (event.target === this) closeRoster()">
        <div class="modal-box">
            <h3>
                <span id="rosterModalTitle">Team Roster</span>
                <button class="modal-close" onclick="closeRoster()">&times;</button>
            </h3>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Player</th>
                            <th>NFL Team</th>
                        </tr>
                    </thead>
                    <tbody id="rosterModalBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const fmtMoney = (n) => `$${Number(n || 0).toFixed(2)}`;

        const GITHUB_OWNER = 'nareshValavala';
        const GITHUB_REPO = 'Yahoo-Fantasy-Winners-Dashboard';
        const GITHUB_BRANCH = 'main';
        const TEAMS_CONFIG_PATH = 'config/teams.json';
        const DATA_FILE_PATH = 'data/league.json';
        const WORKFLOW_FILE = 'update-league-data.yml';

        let currentData = null;

        const VERCEL_API_BASE = 'https://yahoo-fantasy-winners-dashboard.vercel.app';

        // Public — no admin token needed. The Vercel function holds its own
        // server-side GitHub token, so anyone can trigger a refresh.
        async function refreshNow() {
            const btn = document.getElementById('refreshNowBtn');
            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = '🔄 Triggering…';
            try {
                const res = await fetch(`${VERCEL_API_BASE}/api/trigger-update`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
                toast(data.message || 'Refresh triggered.');
            } catch (error) {
                toast(`Could not trigger refresh: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        let teamsByKey = {};
        let isAdmin = false;
        let teamsConfigCache = null; // ./config/teams.json — roster + dues, public/static

        // ---- Shared GitHub Contents API helpers (admin writes only) ----

        async function githubGetFile(path) {
            const token = getAdminToken();
            const res = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`,
                { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } }
            );
            if (!res.ok) throw new Error(`Could not read ${path} (HTTP ${res.status})`);
            const fileData = await res.json();
            return { content: JSON.parse(decodeURIComponent(escape(atob(fileData.content)))), sha: fileData.sha };
        }

        async function githubPutFile(path, dataObj, message, sha) {
            const token = getAdminToken();
            const newContent = JSON.stringify(dataObj, null, 2) + '\n';
            const res = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`,
                {
                    method: 'PUT',
                    headers: {
                        Authorization: `Bearer ${token}`,
                        Accept: 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message,
                        content: btoa(unescape(encodeURIComponent(newContent))),
                        sha,
                        branch: GITHUB_BRANCH
                    })
                }
            );
            if (!res.ok) throw new Error(`Save failed (HTTP ${res.status})`);
        }

        async function triggerWorkflowRefresh() {
            const token = getAdminToken();
            await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
                {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${token}`,
                        Accept: 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ref: GITHUB_BRANCH })
                }
            );
        }

        // ---- Manual data mode (used until the Yahoo automation is connected) ----

        function computeManualTeams(weeklyWinners) {
            const winsByTeam = {};
            const cashByTeam = {};
            (weeklyWinners || []).forEach(w => {
                winsByTeam[w.teamName] = (winsByTeam[w.teamName] || 0) + 1;
                cashByTeam[w.teamName] = (cashByTeam[w.teamName] || 0) + Number(w.prize || 0);
            });

            return (teamsConfigCache?.teams || []).map((t, i) => {
                const weeklyCash = cashByTeam[t.team] || 0;
                return {
                    teamKey: `manual.${i + 1}`,
                    name: t.team,
                    manager: t.manager,
                    draftPosition: t.draftPosition,
                    duesPaid: t.paid,
                    rank: null,
                    wins: 0,
                    losses: 0,
                    ties: 0,
                    pointsFor: 0,
                    weeklyWins: winsByTeam[t.team] || 0,
                    weeklyCash,
                    placementCash: 0,
                    totalCash: weeklyCash,
                    roster: []
                };
            });
        }

        function computeDuesSummary() {
            const buyInPerTeam = teamsConfigCache?.buyInPerTeam || 0;
            const teams = teamsConfigCache?.teams || [];
            const paidCount = teams.filter(t => t.paid).length;
            return {
                buyInPerTeam,
                totalExpected: buyInPerTeam * teams.length,
                totalCollected: buyInPerTeam * paidCount
            };
        }

        function buildManualLeagueData(existing, weeklyWinners) {
            return {
                dataSource: 'manual',
                leagueName: existing.leagueName || null,
                leagueKey: existing.leagueKey || null,
                season: existing.season || null,
                currentWeek: existing.currentWeek || null,
                isFinished: existing.isFinished || false,
                lastUpdated: new Date().toISOString(),
                payouts: existing.payouts,
                dues: computeDuesSummary(),
                teams: computeManualTeams(weeklyWinners),
                weeklyWinners: [...weeklyWinners].sort((a, b) => b.week - a.week)
            };
        }

        // mutateWeeklyWinners: (existingWeeklyWinners) => newWeeklyWinners
        async function saveManualDataFile(mutateWeeklyWinners) {
            const { content: data, sha } = await githubGetFile(DATA_FILE_PATH);
            const weeklyWinners = mutateWeeklyWinners(data.weeklyWinners || []);
            const updated = buildManualLeagueData(data, weeklyWinners);
            await githubPutFile(DATA_FILE_PATH, updated, 'Update league data (manual)', sha);
            currentData = updated;
            render(updated);
        }

        async function saveManualWinner() {
            const week = parseInt(document.getElementById('manualWeek').value, 10);
            const teamName = document.getElementById('manualTeam').value;
            const score = parseFloat(document.getElementById('manualScore').value);

            if (!week || !teamName || isNaN(score)) {
                toast('Fill in week, team, and score.', 'error');
                return;
            }

            const team = teamsConfigCache?.teams.find(t => t.team === teamName);
            const prize = currentData?.payouts?.weeklyPrize ?? 20;

            try {
                await saveManualDataFile(existingWinners => {
                    const withoutThisWeek = existingWinners.filter(w => w.week !== week);
                    withoutThisWeek.push({
                        week, teamName, manager: team?.manager || 'Unknown', score, prize, tied: false, source: 'manual'
                    });
                    return withoutThisWeek;
                });
                toast(`Saved Week ${week} winner: ${teamName}`);
                document.getElementById('manualWeek').value = '';
                document.getElementById('manualScore').value = '';
            } catch (error) {
                toast(`Could not save: ${error.message}`, 'error');
            }
        }

        async function removeManualWinner(week) {
            if (!confirm(`Remove the recorded winner for Week ${week}?`)) return;
            try {
                await saveManualDataFile(existingWinners => existingWinners.filter(w => w.week !== week));
                toast(`Removed Week ${week}.`);
            } catch (error) {
                toast(`Could not remove: ${error.message}`, 'error');
            }
        }

        async function loadTeamsConfig() {
            try {
                const res = await fetch('./config/teams.json', { cache: 'no-store' });
                if (res.ok) teamsConfigCache = await res.json();
            } catch (error) {
                console.error('Failed to load teams config:', error);
            }
        }

        function populateManualTeamSelect() {
            const select = document.getElementById('manualTeam');
            if (!select || !teamsConfigCache) return;
            select.innerHTML = teamsConfigCache.teams.map(t => `<option value="${t.team}">${t.team}</option>`).join('');
        }

        // ---- Admin mode (writes go straight to GitHub via a personal access token
        // you paste in and that stays only in your own browser's localStorage) ----

        function getAdminToken() {
            return localStorage.getItem('adminGithubToken') || '';
        }

        async function unlockAdmin() {
            const input = document.getElementById('adminTokenInput');
            const token = input.value.trim();
            if (!token) return;

            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {
                    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
                });
                if (!res.ok) throw new Error(`GitHub rejected the token (HTTP ${res.status})`);
                const repoData = await res.json();
                if (!repoData.permissions || !repoData.permissions.push) {
                    throw new Error('This token does not have write access to the repo.');
                }

                localStorage.setItem('adminGithubToken', token);
                isAdmin = true;
                renderAdminBar();
                toast('Admin mode enabled.');
                loadLeagueData();
            } catch (error) {
                toast(`Could not enable admin mode: ${error.message}`, 'error');
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('adminGithubToken');
            isAdmin = false;
            renderAdminBar();
            loadLeagueData();
        }

        function renderAdminBar() {
            const bar = document.getElementById('adminBar');
            const manualTabBtn = document.getElementById('manualTabBtn');
            if (isAdmin) {
                bar.innerHTML = `
                    <span class="admin-badge">🔓 Admin Mode</span>
                    <span class="label">Dues are now editable, and a "Record Winner" tab has appeared.</span>
                    <button class="secondary" onclick="logoutAdmin()" style="margin-left: auto;">Exit Admin</button>
                `;
                manualTabBtn.hidden = false;
                populateManualTeamSelect();
            } else {
                bar.innerHTML = `
                    <span class="label">Admin:</span>
                    <input type="password" id="adminTokenInput" placeholder="Paste a GitHub personal access token">
                    <button onclick="unlockAdmin()">Unlock Admin</button>
                `;
                manualTabBtn.hidden = true;
                if (manualTabBtn.classList.contains('active')) switchTab(DEFAULT_TAB);
            }
        }

        async function saveDuesPaid(teamName, newPaidValue) {
            const { content: config, sha } = await githubGetFile(TEAMS_CONFIG_PATH);
            const team = config.teams.find(t => t.team === teamName);
            if (!team) throw new Error(`Team "${teamName}" not found in config/teams.json`);
            team.paid = newPaidValue;

            await githubPutFile(
                TEAMS_CONFIG_PATH,
                config,
                `Update dues: ${teamName} -> ${newPaidValue ? 'paid' : 'unpaid'}`,
                sha
            );
            teamsConfigCache = config;

            // If Yahoo automation is live, trigger an on-demand refresh so data/league.json
            // picks up the change too. In manual mode there's nothing to run.
            if (currentData && currentData.dataSource === 'yahoo') {
                await triggerWorkflowRefresh();
            } else {
                await saveManualDataFile(d => d); // just re-syncs dues totals into data/league.json
            }
        }

        async function handleDuesToggle(teamName, checked, checkboxEl) {
            checkboxEl.disabled = true;
            const wasYahoo = currentData?.dataSource === 'yahoo';
            try {
                await saveDuesPaid(teamName, checked);
                toast(wasYahoo ? 'Saved — the site will refresh with the new data in a minute or two.' : 'Saved.');
            } catch (error) {
                checkboxEl.checked = !checked;
                toast(`Could not save: ${error.message}`, 'error');
            } finally {
                checkboxEl.disabled = false;
            }
        }

        // ---- Tabs ----

        const TAB_NAMES = ['standings', 'teams', 'winners', 'dues', 'manual'];
        const DEFAULT_TAB = 'standings';

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });
            document.querySelectorAll('.tab-panel').forEach(panel => {
                panel.hidden = panel.dataset.tab !== tabName;
            });
            try { localStorage.setItem('activeTab', tabName); } catch {}
        }

        function getInitialTab() {
            let saved = null;
            try { saved = localStorage.getItem('activeTab'); } catch {}
            if (saved && TAB_NAMES.includes(saved) && (saved !== 'manual' || isAdmin)) return saved;
            return DEFAULT_TAB;
        }

        function toast(message, type = 'info') {
            const el = document.createElement('div');
            el.className = `toast ${type === 'error' ? 'error' : ''}`;
            el.textContent = message;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        // ---- Team roster modal (read-only, visible to everyone) ----

        function showRoster(teamKey) {
            const team = teamsByKey[teamKey];
            if (!team) return;

            document.getElementById('rosterModalTitle').textContent = `${team.name} — Roster`;
            const tbody = document.getElementById('rosterModalBody');
            const roster = team.roster || [];

            tbody.innerHTML = roster.length
                ? roster.map(p => `
                    <tr>
                        <td>${p.position}</td>
                        <td>${p.name}${p.status ? ` <span class="badge status">${p.status}</span>` : ''}</td>
                        <td>${p.nflTeam || '—'}</td>
                    </tr>
                `).join('')
                : '<tr><td colspan="3">No roster data available yet.</td></tr>';

            document.getElementById('rosterModal').hidden = false;
        }

        function closeRoster() {
            document.getElementById('rosterModal').hidden = true;
        }

        async function loadLeagueData() {
            try {
                const response = await fetch('./data/league.json', { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                currentData = data;

                if (!data.lastUpdated) {
                    showBanner(
                        isAdmin
                            ? 'No data yet. Use the "Record Weekly Winner" panel below to enter results by hand until Yahoo automation is connected.'
                            : 'No data yet — check back soon.',
                        'warning'
                    );
                } else {
                    document.getElementById('statusBanner').innerHTML = '';
                }

                render(data);
            } catch (error) {
                console.error('Failed to load league data:', error);
                showBanner(`Failed to load league data: ${error.message}`, 'error');
            }
        }

        function showBanner(message, type) {
            document.getElementById('statusBanner').innerHTML =
                `<div class="section status status-${type}">${message}</div>`;
        }

        function render(data) {
            const leagueName = data.leagueName || teamsConfigCache?.leagueName || 'NFL Fantasy League';
            const leagueId = (data.leagueKey ? data.leagueKey.split('.').pop() : null) || teamsConfigCache?.leagueId;

            document.getElementById('leagueSubtitle').textContent =
                `${leagueName}${leagueId ? ` (Yahoo League #${leagueId})` : ''}` +
                `${data.currentWeek ? ` — Week ${data.currentWeek}` : ''}${data.isFinished ? ' (Season Complete)' : ''}`;

            const noteEl = document.getElementById('dataSourceNote');
            if (data.dataSource === 'manual') {
                noteEl.innerHTML = '<span class="data-source-note manual">📝 Manual entry — Yahoo automation not connected yet</span>';
            } else if (data.dataSource === 'yahoo') {
                noteEl.innerHTML = '<span class="data-source-note yahoo">✓ Live from Yahoo</span>';
            } else {
                noteEl.innerHTML = '';
            }

            // The roster/dues config is known even before Yahoo or a manual entry has
            // populated data/league.json's teams array — fall back to it so the Teams
            // and Dues tabs aren't empty on a totally fresh site.
            const usingFallbackTeams = !data.teams || !data.teams.length;
            const teams = usingFallbackTeams ? computeManualTeams(data.weeklyWinners || []) : data.teams;
            const dues = usingFallbackTeams ? computeDuesSummary() : data.dues;

            teamsByKey = {};
            teams.forEach(t => { teamsByKey[t.teamKey] = t; });

            renderPayouts(data.payouts);
            renderDues(dues, teams);
            renderTeams(teams);
            renderStandings(teams, data.dataSource);
            renderWinners(data.weeklyWinners || []);

            document.getElementById('lastUpdated').textContent =
                data.lastUpdated ? `Last updated: ${new Date(data.lastUpdated).toLocaleString()}` : '';
        }

        function renderPayouts(payouts) {
            if (!payouts) return;
            const placements = payouts.placementPrizes || {};
            const seasonTotal = Object.values(placements).reduce((a, b) => a + Number(b), 0);
            const weeklyTotal = payouts.weeklyPrize * payouts.weeklyPrizeWeeks;

            const cards = [
                { label: `Weekly Winner (Wk 1-${payouts.weeklyPrizeWeeks})`, amount: payouts.weeklyPrize },
                { label: '1st Place', amount: placements['1'] },
                { label: '2nd Place', amount: placements['2'] },
                { label: '3rd Place', amount: placements['3'] },
                { label: 'Total Pool', amount: weeklyTotal + seasonTotal },
            ];

            document.getElementById('payoutGrid').innerHTML = cards.map(c => `
                <div class="payout-card">
                    <div class="amount">${fmtMoney(c.amount)}</div>
                    <div class="label">${c.label}</div>
                </div>
            `).join('');
        }

        function renderDues(dues, teams) {
            const tbody = document.querySelector('#duesTable tbody');
            if (!teams.length) {
                tbody.innerHTML = '<tr><td colspan="3">No roster data yet.</td></tr>';
                document.getElementById('duesSummary').textContent = '';
                return;
            }

            const sorted = [...teams].sort((a, b) => (a.draftPosition ?? 999) - (b.draftPosition ?? 999));

            tbody.innerHTML = sorted.map(team => `
                <tr>
                    <td><strong>${team.name}</strong></td>
                    <td>${team.manager}</td>
                    <td>${isAdmin
                        ? `<input type="checkbox" class="dues-checkbox" ${team.duesPaid ? 'checked' : ''}
                             onchange="handleDuesToggle('${team.name.replace(/'/g, "\\'")}', this.checked, this)">`
                        : (team.duesPaid
                            ? '<span class="badge paid">Paid</span>'
                            : '<span class="badge unpaid">Unpaid</span>')}</td>
                </tr>
            `).join('');

            if (dues) {
                document.getElementById('duesSummary').textContent =
                    `Collected ${fmtMoney(dues.totalCollected)} of ${fmtMoney(dues.totalExpected)} (${fmtMoney(dues.buyInPerTeam)}/team)`;
            }
        }

        function renderTeams(teams) {
            const tbody = document.querySelector('#teamsTable tbody');
            if (!teams.length) {
                tbody.innerHTML = '<tr><td colspan="3">No team data yet.</td></tr>';
                return;
            }

            const sorted = [...teams].sort((a, b) => (a.draftPosition ?? 999) - (b.draftPosition ?? 999));

            tbody.innerHTML = sorted.map(team => `
                <tr>
                    <td>${team.draftPosition ?? '—'}</td>
                    <td><button class="team-link" onclick="showRoster('${team.teamKey}')">${team.name}</button></td>
                    <td>${team.manager}</td>
                </tr>
            `).join('');
        }

        function renderStandings(teams, dataSource) {
            const thead = document.getElementById('standingsHead');
            const tbody = document.querySelector('#standingsTable tbody');
            const isYahoo = dataSource === 'yahoo';

            thead.innerHTML = isYahoo
                ? '<tr><th>Rank</th><th>Team</th><th>Manager</th><th>W-L-T</th><th>Points For</th><th>Weekly Wins</th><th>Cash Won</th></tr>'
                : '<tr><th>Team</th><th>Manager</th><th>Weekly Wins</th><th>Cash Won</th></tr>';

            if (!teams.length) {
                tbody.innerHTML = `<tr><td colspan="${isYahoo ? 7 : 4}">No standings data yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = teams.map(team => isYahoo ? `
                <tr class="${team.rank === 1 ? 'rank-1' : ''}">
                    <td>${team.rank ?? '—'}</td>
                    <td><button class="team-link" onclick="showRoster('${team.teamKey}')">${team.name}</button></td>
                    <td>${team.manager}</td>
                    <td>${team.wins}-${team.losses}-${team.ties}</td>
                    <td>${Number(team.pointsFor).toFixed(2)}</td>
                    <td>${team.weeklyWins || 0}</td>
                    <td class="cash">${fmtMoney(team.totalCash)}</td>
                </tr>
            ` : `
                <tr>
                    <td><strong>${team.name}</strong></td>
                    <td>${team.manager}</td>
                    <td>${team.weeklyWins || 0}</td>
                    <td class="cash">${fmtMoney(team.totalCash)}</td>
                </tr>
            `).join('');
        }

        function renderWinners(winners) {
            const tbody = document.querySelector('#winnersTable tbody');
            if (!winners.length) {
                tbody.innerHTML = '<tr><td colspan="5">No completed weeks yet.</td></tr>';
                return;
            }

            tbody.innerHTML = winners.map(w => `
                <tr>
                    <td>Week ${w.week}${w.tied ? '<span class="badge tied">Tied</span>' : ''}</td>
                    <td><strong>${w.teamName}</strong></td>
                    <td>${w.manager}</td>
                    <td>${Number(w.score).toFixed(2)}</td>
                    <td class="cash">${fmtMoney(w.prize)}${isAdmin && w.source === 'manual'
                        ? `<button class="remove-link" onclick="removeManualWinner(${w.week})">Remove</button>`
                        : ''}</td>
                </tr>
            `).join('');
        }

        (async () => {
            isAdmin = !!getAdminToken();
            await loadTeamsConfig();
            renderAdminBar();
            switchTab(getInitialTab());
            await loadLeagueData();
        })();
    </script>
</body>

</html>
